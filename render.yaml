# Render.com Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec

version: "1"

databases:
  # Managed PostgreSQL Database for Student CRUD
  - name: student-db
    databaseName: db_student
    user: db_student_user
    plan: free
    region: oregon

services:
  # -----------------------------------------------------------
  # 1. Spring Boot Backend Web Service (Java 21 + Docker)
  # -----------------------------------------------------------
  - type: web
    name: student-backend
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./student
    dockerfilePath: ./student/Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: student-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: student-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: student-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: student-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: student-db
          property: password
      - key: DB_SSLMODE
        value: require
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Xss512k -XX:ReservedCodeCacheSize=48m

  # -----------------------------------------------------------
  # 2. Vite React Frontend (Static Site - Served globally via CDN)
  # Note: Static sites do not have a region or compute plan in Render.
  # -----------------------------------------------------------
  - type: web
    name: student-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: student-backend
          property: host
      - key: VITE_API_BASE_URL
        value: https://student-backend.onrender.com/manco/students
